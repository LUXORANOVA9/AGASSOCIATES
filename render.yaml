services:
  # FastAPI Backend (Docker)
  - type: web
    name: luxor9-backend
    runtime: docker
    dockerContext: ./ag-associates-ai/backend
    dockerfilePath: ./ag-associates-ai/backend/Dockerfile
    region: singapore
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: luxor9-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: luxor9-redis
          property: connectionString
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # Next.js / Vite Frontend (Docker)
  - type: web
    name: luxor9-frontend
    runtime: docker
    dockerContext: ./ag-platform
    dockerfilePath: ./ag-platform/Dockerfile
    region: singapore
    plan: standard
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: luxor9-backend
          property: url

  # Redis Cache
  - type: redis
    name: luxor9-redis
    region: singapore
    plan: free

databases:
  # PostgreSQL DB (Render Native - Supports pgvector natively with pg 15)
  - name: luxor9-db
    region: singapore
    plan: standard
    postgresMajorVersion: "15"
