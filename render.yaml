services:
  # FastAPI Backend (Docker)
  - type: web
    name: ag-backend
    runtime: docker
    dockerContext: ./ag-associates-ai/backend
    dockerfilePath: ./ag-associates-ai/backend/Dockerfile
    region: singapore
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: ag-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: ag-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: ag-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: ag-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: ag-db
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: ag-redis
          property: connectionString
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL_NAME
        value: gemini-2.0-flash
      - key: PDF_ENABLED
        value: "true"
      - key: ENVIRONMENT
        value: production

  # AG Platform (Express + Vite)
  - type: web
    name: ag-platform
    runtime: docker
    dockerContext: ./ag-platform
    dockerfilePath: ./ag-platform/Dockerfile
    region: singapore
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: AI_BACKEND_URL
        fromService:
          type: web
          name: ag-backend
          property: hostport

  # Redis Cache
  - type: redis
    name: ag-redis
    region: singapore
    plan: free

databases:
  - name: ag-db
    region: singapore
    plan: standard
    postgresMajorVersion: "16"
    databaseName: ag_platform
