name: ag-prod

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    container_name: ag_caddy
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD_HASH: ${N8N_BASIC_AUTH_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./clerk-docs/dist:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ag-platform
      - ai-dashboard
      - ai-backend
      - intake-api
      - telegram-bot
      - n8n
    networks: [ag_net]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ag_postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./ag-associates-ai/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ag_net]

  redis:
    image: redis:7-alpine
    container_name: ag_redis
    <<: [*restart, *logging]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ag_net]

  ai-backend:
    build:
      context: ./ag-associates-ai/backend
    image: ghcr.io/luxoranova9/ag-ai-backend:${IMAGE_TAG:-latest}
    container_name: ag_ai_backend
    <<: [*restart, *logging]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      LLM_API_KEY: ${LLM_API_KEY}
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      OUTPUT_DIR: /app/output
      PDF_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: https://app.${DOMAIN},https://dashboard.${DOMAIN}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      N8N_WEBHOOK_KEY: ${N8N_WEBHOOK_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # NeSL / IGR e-filing
      NESL_API_KEY: ${NESL_API_KEY:-}
      NESL_API_BASE_URL: ${NESL_API_BASE_URL:-https://api.nesl.co.in/v1}
      NESL_CLIENT_ID: ${NESL_CLIENT_ID:-}
      NESL_CLIENT_SECRET: ${NESL_CLIENT_SECRET:-}
      NESL_MOCK_DELAY_SEC: ${NESL_MOCK_DELAY_SEC:-3}
      IGR_PORTAL_URL: ${IGR_PORTAL_URL:-}
      IGR_PORTAL_USERNAME: ${IGR_PORTAL_USERNAME:-}
      IGR_PORTAL_PASSWORD: ${IGR_PORTAL_PASSWORD:-}
      GRAS_PORTAL_URL: ${GRAS_PORTAL_URL:-}
    volumes:
      - ag_output:/app/output
      - ag_documents:/srv/ag/documents
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [ag_net]

  ai-dashboard:
    build:
      context: ./ag-associates-ai/frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    image: ghcr.io/luxoranova9/ag-ai-dashboard:${IMAGE_TAG:-latest}
    container_name: ag_ai_dashboard
    <<: [*restart, *logging]
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on: [ai-backend]
    networks: [ag_net]

  ag-platform:
    build:
      context: ./ag-platform
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: /api
    image: ghcr.io/luxoranova9/ag-platform:${IMAGE_TAG:-latest}
    container_name: ag_platform
    <<: [*restart, *logging]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AI_BACKEND_URL: http://ai-backend:8000
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ag_net]

  n8n:
    image: n8nio/n8n:latest
    container_name: ag_n8n
    <<: [*restart, *logging]
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_TRUSTED_PROXIES: "*"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ag_net]

  # ── NOI Automation Services ──────────────────────────────────────────

  intake-api:
    build:
      context: ./ag-platform/services/intake-api
    image: ghcr.io/luxoranova9/intake-api:${IMAGE_TAG:-latest}
    ports:
      - "3002:3002"
    container_name: ag_intake_api
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      redis: { condition: service_healthy }
    networks: [ag_net]

  telegram-bot:
    build:
      context: ./ag-associates-ai/backend/telegram_bot
    image: ghcr.io/luxoranova9/telegram-bot:${IMAGE_TAG:-latest}
    container_name: ag_telegram_bot
    <<: [*restart, *logging]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TELEGRAM_BOT_PORT: 3003
    depends_on:
      redis: { condition: service_healthy }
    networks: [ag_net]

  email-intake:
    build:
      context: ./ag-associates-ai/backend/email_intake
    image: ghcr.io/luxoranova9/email-intake:${IMAGE_TAG:-latest}
    container_name: ag_email_intake
    <<: [*restart, *logging]
    environment:
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_IMAP_USER: ${EMAIL_IMAP_USER}
      EMAIL_IMAP_PASS: ${EMAIL_IMAP_PASS}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LLM_BASE_URL: http://ai-backend:8000/v1
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      LLM_API_KEY: ${LLM_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL:-60}
      EMAIL_INTAKE_PORT: 3004
    depends_on:
      redis: { condition: service_healthy }
    networks: [ag_net]

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:
  ag_output:
  redis_data:
  ag_documents:

networks:
  ag_net:
    driver: bridge
