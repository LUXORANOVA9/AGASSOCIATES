name: Install Deploy Key
on: workflow_dispatch
jobs:
  install-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add public key to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            mkdir -p ~deploy/.ssh
            echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEopV2TByo/IsqZFactZQg2w7d03ttz5oH20wz8eIuhH opencode-deploy-key' >> ~deploy/.ssh/authorized_keys
            sort -u ~deploy/.ssh/authorized_keys -o ~deploy/.ssh/authorized_keys
            echo "Key installed"
