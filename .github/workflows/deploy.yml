name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Stack
    runs-on: ag-prod-runner-v2
    steps:
      - run: |
          set -e
          cd /home/luxor9/AGASSOCIATES
          git pull origin main

          # Apply Supabase migrations if token is available
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Applying Supabase migrations..."
            npx supabase db push --project-ref kglqdihggncxkwwsgguw --token "$SUPABASE_ACCESS_TOKEN"
          fi

          docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env build
          docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env up -d --remove-orphans

          echo "Running comprehensive health checks..."
          ./scripts/verify-deploy.sh
