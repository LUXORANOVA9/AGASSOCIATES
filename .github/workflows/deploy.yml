name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths:
      - "ag-associates-ai/**"
      - "ag-platform/**"
      - "ag-platform/services/intake-api/**"
      - "ag-associates-ai/backend/telegram_bot/**"
      - "ag-associates-ai/backend/email_intake/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: luxoranova9
  COMPOSE_FILE: docker-compose.prod.yml
  ENV_FILE: /srv/ag/.env

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Ensure deploy user and SSH access
        run: |
          id deploy 2>/dev/null || useradd -m -s /bin/bash deploy
          mkdir -p /home/deploy/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFBdZMtB65G0IIVz3MGIA4LeelHHo0zSOq7P5BdnoW6I luxor9@luxor9-Victus-by-HP-Laptop-16-d0xxx" >> /home/deploy/.ssh/authorized_keys
          chmod 600 /home/deploy/.ssh/authorized_keys
          chown -R deploy:deploy /home/deploy/.ssh
          usermod -aG docker deploy
          systemctl restart sshd 2>/dev/null || service ssh restart 2>/dev/null || echo "sshd restart attempted"

      - name: Ensure /srv/ag/.env exists
        run: |
          if [ ! -f /srv/ag/.env ]; then
            PW1=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 32)
            PW2=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 32)
            JWT=$(openssl rand -hex 64)
            NWK=$(openssl rand -hex 32)
            mkdir -p /srv/ag
            cat > /srv/ag/.env << ENVEOF
DOMAIN=advadiityagade.com
ACME_EMAIL=rajkhemani24@gmail.com
POSTGRES_USER=agadmin
POSTGRES_PASSWORD=$PW1
POSTGRES_DB=agdb
REDIS_PASSWORD=$PW2
LLM_BASE_URL=https://api.groq.com/openai/v1
LLM_MODEL_NAME=llama-3.3-70b-versatile
LLM_MOCK_MODE=true
SUPABASE_URL=https://kglqdihggncxkwwsgguw.supabase.co
SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnbHFkaWhnZ25jeGt3d3NnZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDEzMDUsImV4cCI6MjA5Mjk3NzMwNX0.fFnHP2GAZcXEDpeI58uxYYwO5UliQFKG65I5plX01MA
JWT_SECRET=$JWT
N8N_WEBHOOK_KEY=$NWK
N8N_BASIC_AUTH_USER=admin
N8N_BASIC_AUTH_PASSWORD_HASH=admin
ENVIRONMENT=production
IMAGE_TAG=latest
NESL_MOCK_DELAY_SEC=3
ENVEOF
            chmod 600 /srv/ag/.env
            echo "Created /srv/ag/.env with auto-generated secrets"
          fi

      - name: Build all services
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} --env-file ${{ env.ENV_FILE }} build

      - name: Push images to GHCR (backup)
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          images="ag-ai-backend ag-ai-dashboard ag-platform intake-api telegram-bot email-intake"
          for img in $images; do
            full="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/$img"
            docker tag "$full:latest" "$full:${{ github.sha }}"
            docker push "$full:latest"
            docker push "$full:${{ github.sha }}"
          done

      - name: Deploy stack
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} --env-file ${{ env.ENV_FILE }} up -d --remove-orphans
          docker image prune -f

      - name: Smoke test
        run: |
          DOMAIN=$(grep ^DOMAIN= /srv/ag/.env | cut -d= -f2)
          for i in 1 2 3 4 5 6; do
            if curl -sf -H "Host: api.$DOMAIN" http://127.0.0.1/health >/dev/null 2>&1; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for API ($i/6)…"; sleep 10
          done
          echo "API failed to become healthy"; exit 1
