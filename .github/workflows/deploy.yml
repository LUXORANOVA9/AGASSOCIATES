name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths:
      - "ag-associates-ai/**"
      - "ag-platform/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: luxoranova9

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ag-ai-backend
            context: ag-associates-ai/backend
          - name: ag-ai-dashboard
            context: ag-associates-ai/frontend
          - name: ag-platform
            context: ag-platform
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /srv/ag/repo
            git fetch origin main
            git reset --hard origin/main
            cd /srv/ag
            export IMAGE_TAG=${{ github.sha }}
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f

      - name: Smoke test API health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://api.${{ secrets.PROD_DOMAIN }}/health" >/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for API ($i/6)…"; sleep 10
          done
          echo "API failed to become healthy"; exit 1
