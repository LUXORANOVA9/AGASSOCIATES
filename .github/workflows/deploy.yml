name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Stack
    runs-on: ag-prod-runner-v2
    steps:
      - run: |
          set -e
          cd /home/luxor9/AGASSOCIATES
          git pull origin main
          docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env build
          docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          for i in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API healthy"
              exit 0
            fi
            sleep 10
          done
          echo "API not healthy"
          exit 1
