name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (leave empty for all)'
        required: false
        type: string
      ref:
        description: 'Branch/ref to deploy (default: main)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Stack
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Sync to /srv/ag/repo and deploy
        run: |
          set -e
          REPO_DIR="/srv/ag/repo"
          ENV_FILE="/srv/ag/.env"
          COMPOSE_FILE="$REPO_DIR/docker-compose.prod.yml"
          BRANCH="${{ inputs.ref || 'main' }}"

          echo "==> Syncing to $REPO_DIR"
          sudo rsync -a --delete --exclude=.git --exclude=node_modules \
            "$GITHUB_WORKSPACE/" "$REPO_DIR/"

          cd "$REPO_DIR"
          git config --global --add safe.directory "$REPO_DIR" 2>/dev/null || true

          echo "==> Checking out $BRANCH"
          git fetch origin
          git checkout --force "$BRANCH"
          git pull origin "$BRANCH"

          if [ -n "${{ inputs.service }}" ]; then
            echo "==> Building service: ${{ inputs.service }}"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build "${{ inputs.service }}"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans "${{ inputs.service }}"
          else
            echo "==> Building all services"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans
          fi

      - name: Wait for health
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "API healthy after ${i}0s"
              exit 0
            fi
            echo "Waiting... ($((i*10))s)"
            sleep 10
          done
          echo "API not healthy"
          exit 1

      - name: Smoke test — Aisha chat
        run: |
          echo -n "Aisha: "
          AISHA=$(curl -s -X POST http://127.0.0.1:8000/api/aisha/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"hello","user_id":"smoke_test","chat_id":"smoke"}')
          echo "$AISHA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('response','')[:80])"

      - name: Smoke test — Health endpoint
        run: |
          echo -n "Health: "
          curl -sf http://127.0.0.1:8000/health && echo " OK"

      - name: Deploy summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ inputs.ref || 'main' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.service || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
