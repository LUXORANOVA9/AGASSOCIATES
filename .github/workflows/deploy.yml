name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths:
      - "ag-associates-ai/**"
      - "ag-platform/**"
      - "ag-platform/services/intake-api/**"
      - "ag-associates-ai/backend/telegram_bot/**"
      - "ag-associates-ai/backend/email_intake/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: luxoranova9
  COMPOSE_FILE: docker-compose.prod.yml
  ENV_FILE: /srv/ag/.env

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check firewall
        run: |
          echo "=== Firewall check ==="
          iptables -L -n 2>/dev/null || echo "no iptables"
          ufw status 2>/dev/null || echo "no ufw"
          nft list ruleset 2>/dev/null | head -20 || echo "no nft"
          echo "=== SSH status ==="
          systemctl status ssh 2>/dev/null | head -5 || echo "ssh service check failed"
          ss -tlnp | grep 22 || echo "port 22 not listening"
          echo "=== Hetzner firewall API ==="
          curl -sf https://api.hetzner.cloud/v1/firewalls 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "API key not configured"

      - name: Fix SSH
        run: |
          set -ex
          mkdir -p /root/.ssh /home/deploy/.ssh
          cat > /root/.ssh/authorized_keys << 'KEYS'
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILa+pYqBIW5s4nYrmZrESiJmtJfodfI+aeSP8BcYo6Xj rajkhemani24@gmail.com
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFBdZMtB65G0IIVz3MGIA4LeelHHo0zSOq7P5BdnoW6I luxor9@luxor9-Victus-by-HP-Laptop-16-d0xxx
KEYS
          cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
          chown -R deploy:deploy /home/deploy/.ssh
          systemctl enable ssh
          systemctl restart ssh
          systemctl is-active ssh

      - name: Create env file
        run: |
          if [ ! -f /srv/ag/.env ]; then
            PW1=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 32)
            PW2=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 32)
            JWT=$(openssl rand -hex 64)
            NWK=$(openssl rand -hex 32)
            mkdir -p /srv/ag
            cat > /srv/ag/.env << EOF
DOMAIN=advadiityagade.com
ACME_EMAIL=rajkhemani24@gmail.com
POSTGRES_USER=agadmin
POSTGRES_PASSWORD=$PW1
POSTGRES_DB=agdb
REDIS_PASSWORD=$PW2
LLM_BASE_URL=https://api.groq.com/openai/v1
LLM_MODEL_NAME=llama-3.3-70b-versatile
LLM_MOCK_MODE=true
SUPABASE_URL=https://kglqdihggncxkwwsgguw.supabase.co
SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnbHFkaWhnZ25jeGt3d3NnZ3V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDEzMDUsImV4cCI6MjA5Mjk3NzMwNX0.fFnHP2GAZcXEDpeI58uxYYwO5UliQFKG65I5plX01MA
JWT_SECRET=$JWT
N8N_WEBHOOK_KEY=$NWK
N8N_BASIC_AUTH_USER=admin
N8N_BASIC_AUTH_PASSWORD_HASH=admin
ENVIRONMENT=production
IMAGE_TAG=latest
NESL_MOCK_DELAY_SEC=3
EOF
            chmod 600 /srv/ag/.env
            echo "Created /srv/ag/.env with auto-generated secrets"
          else
            echo "/srv/ag/.env already exists"
          fi

      - name: Build
        run: docker compose -f $COMPOSE_FILE --env-file $ENV_FILE build

      - name: Push to GHCR
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for img in ag-ai-backend ag-ai-dashboard ag-platform intake-api telegram-bot email-intake; do
            docker tag ghcr.io/luxoranova9/$img:latest ghcr.io/luxoranova9/$img:${{ github.sha }}
            docker push ghcr.io/luxoranova9/$img:latest
            docker push ghcr.io/luxoranova9/$img:${{ github.sha }}
          done

      - name: Deploy
        run: |
          docker compose -f $COMPOSE_FILE --env-file $ENV_FILE up -d --remove-orphans
          docker image prune -f

      - name: Smoke test
        run: |
          sleep 15
          for i in 1 2 3 4 5 6; do
            if curl -sf http://127.0.0.1/health 2>/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "waiting ($i/6)..."; sleep 10
          done
          echo "API not healthy"; docker compose -f $COMPOSE_FILE ps; exit 1
