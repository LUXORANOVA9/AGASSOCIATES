name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (leave empty for all)'
        required: false
        type: string
      ref:
        description: 'Branch/ref to deploy (default: main)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Stack
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Sync to /srv/ag/repo and deploy
        run: |
          set -e
          REPO_DIR="/srv/ag/repo"
          ENV_FILE="/srv/ag/.env"
          COMPOSE_FILE="$REPO_DIR/docker-compose.prod.yml"

          echo "==> Syncing to $REPO_DIR"
          rsync -a --delete --exclude=.git --exclude=node_modules --exclude=__pycache__ \
            "$GITHUB_WORKSPACE/" "$REPO_DIR/"

          if [ -n "${{ inputs.service }}" ]; then
            echo "==> Building service: ${{ inputs.service }}"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build "${{ inputs.service }}"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans "${{ inputs.service }}"
          else
            echo "==> Building all services"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --remove-orphans
          fi

      - name: Wait for containers to be healthy
        run: |
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ag_ai_backend 2>/dev/null)
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend healthy after ${i}0s"
              docker inspect --format='{{.Name}} {{.State.Health.Status}}' ag_caddy ag_ai_backend ag_telegram_bot ag_postgres ag_redis
              exit 0
            fi
            echo "Waiting... ($((i*10))s) (status: $STATUS)"
            sleep 10
          done
          echo "Backend not healthy"
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          exit 1

      - name: Smoke test — Aisha chat (via Docker network)
        run: |
          echo -n "Aisha: "
          AISHA=$(docker run --rm --network ag-prod_ag_net \
            curlimages/curl:latest -sS -X POST http://ai-backend:8000/api/aisha/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"hello","user_id":"smoke_test","chat_id":"smoke"}')
          echo "$AISHA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('response','')[:80])"

      - name: Smoke test — API health (via Docker network)
        run: |
          set -euo pipefail
          echo -n "Health: "
          # `-sf` makes curl fail on HTTP errors and silence progress. Capture
          # the response body and assert on it, so a connect failure OR a
          # non-200 response both fail this step.
          BODY=$(docker run --rm --network ag-prod_ag_net \
            curlimages/curl:latest -sf http://ai-backend:8000/health)
          echo "$BODY"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok', d"

      - name: Deploy summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ inputs.ref || 'main' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.service || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
