name: Deploy to Production VPS
on:
  push:
    branches: [main]
    paths:
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
concurrency:
  group: deploy-prod
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: luxoranova9
  COMPOSE_FILE: docker-compose.prod.yml
  ENV_FILE: /srv/ag/.env
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: docker compose -f $COMPOSE_FILE --env-file /dev/null build
      - run: docker compose -f $COMPOSE_FILE --env-file /dev/null up -d --remove-orphans
      - run: docker compose -f $COMPOSE_FILE ps
