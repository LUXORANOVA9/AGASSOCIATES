name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths:
      - "ag-associates-ai/**"
      - "ag-platform/**"
      - "ag-platform/services/intake-api/**"
      - "ag-associates-ai/backend/telegram_bot/**"
      - "ag-associates-ai/backend/email_intake/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: luxoranova9

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ag-ai-backend
            context: ag-associates-ai/backend
            build_args: ""
          - name: ag-ai-dashboard
            context: ag-associates-ai/frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.${{ vars.PROD_DOMAIN }}
          - name: ag-platform
            context: ag-platform
            build_args: |
              VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}
              VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
              VITE_API_BASE_URL=/api
          - name: intake-api
            context: ag-platform/services/intake-api
            build_args: ""
          - name: telegram-bot
            context: ag-associates-ai/backend/telegram_bot
            build_args: ""
          - name: email-intake
            context: ag-associates-ai/backend/email_intake
            build_args: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ag
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create/update DNS records on Cloudflare
        run: |
          set -euo pipefail
          ZONE_ID="ad78f4619af17346172199dc76082cab"
          CF_API="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CONTENT_TYPE="Content-Type: application/json"

          # Resolve VPS IP from hostname (in case it's a hostname, not IP)
          VPS_IP=$(dig +short "${{ secrets.VPS_HOST }}" | head -1)
          if [ -z "$VPS_IP" ]; then
            VPS_IP="${{ secrets.VPS_HOST }}"
          fi

          # Create or update intake.advadiityagade.com A record
          SUBDOMAIN="intake"
          NAME="${SUBDOMAIN}.${{ secrets.PROD_DOMAIN }}"

          # Check if record exists
          EXISTING=$(curl -s -H "$AUTH_HEADER" "${CF_API}?name=${NAME}&type=A")
          EXISTING_ID=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d['result'] else '')" 2>/dev/null || echo "")

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing DNS record ${NAME} -> ${VPS_IP}"
            curl -s -X PATCH "${CF_API}/${EXISTING_ID}" \
              -H "$AUTH_HEADER" -H "$CONTENT_TYPE" \
              --data "{\"type\":\"A\",\"name\":\"${NAME}\",\"content\":\"${VPS_IP}\",\"ttl\":120,\"proxied\":false}" >/dev/null
          else
            echo "Creating DNS record ${NAME} -> ${VPS_IP}"
            curl -s -X POST "${CF_API}" \
              -H "$AUTH_HEADER" -H "$CONTENT_TYPE" \
              --data "{\"type\":\"A\",\"name\":\"${NAME}\",\"content\":\"${VPS_IP}\",\"ttl\":120,\"proxied\":false}" >/dev/null
          fi

          echo "DNS record for ${NAME} is ready"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /srv/ag/repo
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env pull
            docker compose -f docker-compose.prod.yml --env-file /srv/ag/.env up -d --remove-orphans
            docker image prune -f

      - name: Smoke test API health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://api.${{ secrets.PROD_DOMAIN }}/health" >/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "waiting for API ($i/6)…"; sleep 10
          done
          echo "API failed to become healthy"; exit 1
