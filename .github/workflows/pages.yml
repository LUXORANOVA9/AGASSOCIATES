name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Render landing page from DEPLOYMENT_PLAYBOOK.md
        run: |
          mkdir -p _site
          cp DEPLOYMENT_PLAYBOOK.md _site/playbook.md
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>AG Associates — Deployment Index</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                       max-width: 720px; margin: 3rem auto; padding: 0 1rem;
                       line-height: 1.6; color: #1f2328; }
                h1 { margin-top: 0; }
                code { background: #f3f4f6; padding: 0.1em 0.4em; border-radius: 4px; }
                a { color: #0969da; }
              </style>
            </head>
            <body>
              <h1>AG Associates</h1>
              <p>
                Production stack runs on a single VPS behind Caddy auto-TLS.
                The full operator playbook lives in the repo:
                <a href="https://github.com/LUXORANOVA9/AGASSOCIATES/blob/main/DEPLOYMENT_PLAYBOOK.md">DEPLOYMENT_PLAYBOOK.md</a>.
              </p>
              <h2>Live endpoints</h2>
              <ul>
                <li><code>app.&lt;domain&gt;</code> — LegalTech case management</li>
                <li><code>dashboard.&lt;domain&gt;</code> — AI workflow dashboard</li>
                <li><code>api.&lt;domain&gt;</code> — FastAPI agent backend</li>
                <li><code>n8n.&lt;domain&gt;</code> — orchestration (basic-auth gated)</li>
                <li><code>docs.&lt;domain&gt;</code> — Clerk-style docs site</li>
              </ul>
              <p><a href="./playbook.md">View the raw deployment playbook</a></p>
            </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
