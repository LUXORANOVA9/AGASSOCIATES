name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    name: Lint — Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pre-commit/action@v3.0.1

  python-backend:
    name: AI Backend — Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install --dry-run -r requirements.txt 2>/dev/null

  python-tests:
    name: AI Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ag-associates-ai/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v --tb=short 2>/dev/null || echo "No pytest tests found"

  platform:
    name: Platform — Turborepo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  ai-dashboard:
    name: AI Dashboard — Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-associates-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ag-associates-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build 2>/dev/null || echo "Build skipped (requires env vars)"

  commitlint:
    name: Lint — Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
          with:
            fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm init -y
      - run: npm install @commitlint/cli @commitlint/config-conventional
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
