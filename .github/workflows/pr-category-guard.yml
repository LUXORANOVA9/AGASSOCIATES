name: PR Category Guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: read

jobs:
  require-category:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Verify PR has a category label
        uses: actions/github-script@v7
        with:
          script: |
            const CATEGORIES = new Set([
              'security','code-health','feature','bugfix',
              'tests','performance','docs','chore',
            ]);
            const labels = (context.payload.pull_request.labels || []).map(l => l.name);
            const hit = labels.find(l => CATEGORIES.has(l));
            if (!hit) {
              core.setFailed(
                `PR #${context.payload.pull_request.number} is missing a category label. ` +
                `The PR Orchestrator workflow normally adds one automatically. ` +
                `Expected one of: ${[...CATEGORIES].join(', ')}.`
              );
            } else {
              core.info(`Category label present: ${hit}`);
            }
