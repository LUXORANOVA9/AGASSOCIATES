name: Fix SSH and Deploy
on: workflow_dispatch
jobs:
  fix:
    runs-on: self-hosted
    steps:
    - run: |
        set -ex
        id deploy || useradd -m deploy
        mkdir -p ~deploy/.ssh /root/.ssh
        cat > ~deploy/.ssh/authorized_keys << 'KEYS'
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILa+pYqBIW5s4nYrmZrESiJmtJfodfI+aeSP8BcYo6Xj rajkhemani24@gmail.com
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFBdZMtB65G0IIVz3MGIA4LeelHHo0zSOq7P5BdnoW6I luxor9@luxor9-Victus-by-HP-Laptop-16-d0xxx
KEYS
        cp ~deploy/.ssh/authorized_keys /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys ~deploy/.ssh/authorized_keys
        chown -R deploy:deploy ~deploy/.ssh
        usermod -aG docker deploy
        systemctl enable ssh 2>/dev/null || true
        systemctl start ssh 2>/dev/null || true

