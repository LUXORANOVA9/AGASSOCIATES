steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'
    dir: 'ag-associates-ai'

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--port'
      - '8001'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'API_HOST=0.0.0.0,API_PORT=8001,LOG_LEVEL=INFO,EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2,EMBEDDING_DIMENSION=384,OUTPUT_DIR=/app/output'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,LLM_BASE_URL=LLM_BASE_URL:latest,LLM_MODEL_NAME=LLM_MODEL_NAME:latest,CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest'

substitutions:
  _REGION: asia-south1
  _REPOSITORY: ag-associates
  _SERVICE_NAME: ag-ai-backend

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest'
